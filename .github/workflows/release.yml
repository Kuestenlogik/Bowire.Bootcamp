name: Release

# One GitHub Release per tag, carrying every exercise as two downloads (#34):
# the shell a learner fills in and the solution. The tags come from the
# Bowire cascade (auto-tag-on-bowire-merge, pushed with a token that
# triggers this) or by hand. The archives are built from the tree as it is
# at the tag, so each names the Bowire version it teaches.

on:
  push:
    tags: ['v*']

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # --verify builds every archive on its own before anything is
      # published: a release never carries a download that does not build.
      - name: Pack every exercise
        run: python3 scripts/pack_exercises.py --version "${GITHUB_REF_NAME}" --verify --check-index

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/exercises/*.zip
