version: 2

# Dependabot config for the Bootcamp. Two ecosystems, and the reason each is
# here is worth writing down because the repo does not look like a code repo
# from the top level: units, capstones and audits are Markdown, but fourteen
# `.csproj` files sit under units/unit-4, units/unit-5 and capstones/, each
# pair a `start/` shell and its `completed/` solution, and CI builds every one
# of them.
#
# Nobody was watching those pins. Grpc.AspNetCore sat on 2.71.0 here while the
# plugin repos had moved to 2.83.0 — a course that teaches against a year-old
# transport is a course that teaches the wrong thing.
#
# Kuestenlogik.Bowire* is deliberately NOT watched: the release cascade
# (bowire-released.yml) owns that bump, in the lesson prose as well as in the
# project files, and two bumpers for one dependency is how you get a pair of
# PRs racing over the same line.

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # The cascade's business, not Dependabot's — see the note above.
      - dependency-name: "Kuestenlogik.Bowire*"
    groups:
      # gRPC ships its runtime, its server bits and its tooling in lockstep;
      # bumping them apart leaves a lesson that builds and a lesson that does
      # not, in the same unit.
      grpc:
        patterns:
          - "Grpc.*"
          - "Google.Protobuf"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
